---
# Fully local, CNCF-aligned stack: Postgres warehouse + Airflow + OTel + Streamlit.
# No cloud credentials required. `docker compose up -d --build` is the whole install.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  image: pii-hygiene-airflow:local
  # Local development only: the bind-mounted ./data directory must be writable
  # by the container. Production paths use scoped service accounts + object storage.
  user: "0:0"
  env_file:
    - .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@warehouse:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/pii/airflow/dags
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    PYTHONPATH: /opt/pii
    PII_DATA_DIR: /opt/pii/data
    PII_DB_HOST: warehouse
    PII_DB_PORT: "5432"
    PII_DB_NAME: pii_lab
    PII_DB_USER: pii_admin
    PII_DB_PASSWORD: pii_admin_pw
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OPENLINEAGE_URL: ""
  volumes:
    - ./:/opt/pii
    - airflow-logs:/opt/airflow/logs
  depends_on:
    warehouse:
      condition: service_healthy

services:
  warehouse:
    image: postgres:16
    container_name: pii-warehouse
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pii_lab
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pii_lab"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    container_name: pii-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username admin --password admin --firstname Local \
          --lastname Admin --role Admin --email admin@example.com || true
        echo "Airflow metadata initialized."
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: pii-airflow-webserver
    command: webserver
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8088}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: pii-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: pii-otel-collector
    user: "0:0"
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel/config.yaml:ro
      - otel-data:/var/lib/otel:rw

  streamlit:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: pii-hygiene-streamlit:local
    container_name: pii-streamlit
    env_file:
      - .env
    environment:
      PII_DB_HOST: warehouse
      PII_DB_PORT: "5432"
      PII_DB_NAME: pii_lab
      # Least-privilege reviewer role: SELECT on marts + UPDATE queue status only.
      PII_DB_USER: reviewer
      PII_DB_PASSWORD: reviewer_pw
      PII_DATA_DIR: /opt/pii/data
    volumes:
      - ./data:/opt/pii/data:ro
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      warehouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  warehouse-data:
  airflow-logs:
  otel-data:
