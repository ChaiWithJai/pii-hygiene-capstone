[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-hygiene-capstone"
version = "0.1.0"
description = "Local-first, CNCF-aligned multi-source PII hygiene, evaluation and agentic triage pipeline"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "dbt_pii_hygiene/target", "dbt_pii_hygiene/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
